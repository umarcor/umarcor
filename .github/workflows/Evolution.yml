name: Evolution

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:

  Config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/upload-artifact@v6
      with:
        name: hdle-config
        path: evolution/*
        include-hidden-files: true
        if-no-files-found: error

  Evolution:
    needs: Config
    uses: hdl/evolution/.github/workflows/Evolution.yml@main
#    with:
#      tasks: |
#        Hitchhiker

  Release:
    needs: Evolution
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v7
      with:
        path: artifact
    - run: |
        cd artifact
        tar czvf glogs.tar.gz glogs
        rm -rf glogs
        find . -size +2G -exec rm {} \;
    - uses: pyTooling/Actions/releaser@r6
      with:
        token: ${{ github.token }}
        files: artifact/**/*
        tag: gource-videos
